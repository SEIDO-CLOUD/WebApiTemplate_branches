# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- 9_integration_test

pool:
  vmImage: 'windows-latest'
  # name: 'MartinsXPS15'
  # demands:
  #   - agent.name -equals MARTINS_XPS15

#https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages?view=azure-devops&tabs=yaml
#stages is a logical group of jobs
#Stages run by default sequentially and you can use dependencies and conditions
variables:
  buildConfiguration: 'Release'

stages:
  - stage: buildAndDeploy 
    jobs:
      - job: buildAndDeployWebApi
        steps:
          - task: NuGetToolInstaller@1

          - task: NuGetCommand@2
            inputs:
              restoreSolution: '$(solution)'

          - task: VSBuild@1
            inputs:
              solution: '$(solution)'
              msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:DesktopBuildPackageLocation="$(build.artifactStagingDirectory)\WebApp.zip" /p:DeployIisAppPath="Default Web Site"'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              itemPattern: 'drop'
              downloadPath: '$(Build.ArtifactStagingDirectory)'
          
          - task: AzureRmWebAppDeployment@4
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'Tanzanite'
              appType: 'webApp'
              WebAppName: 'SYS6-Tanzanite-ws-6755B002D1BB'
              packageForLinux: '$(Build.ArtifactStagingDirectory)\*.zip'


  - stage: IntegrationTest 
    jobs:
    - job: AppWebApiTest
      displayName: 'running AppWebApiTest' 
      timeoutInMinutes: 10
      steps:
        - script: dotnet run --project AppWebApiTest/AppWebApiTest.csproj
  
  - stage: AllGood 
    dependsOn: 
    - buildAndDeploy 
    - IntegrationTest 
    jobs:
    - job: AllGood
      displayName: 'AllGood' 
      timeoutInMinutes: 10
      steps:
      - bash: echo "Deployment and tests successful"
